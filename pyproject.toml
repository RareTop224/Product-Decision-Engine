[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-decision-engine"
version = "0.1.0"
description = "Phase 0 proof-of-value engine for evidence-backed printer TCO decisions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
evaluate-phase0 = "product_decision_engine.evaluation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

